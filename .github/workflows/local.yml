name: Local Build & Test (WSL self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COMPOSE_FILE: /home/david/nerux/virtus/docker-compose.yml
  SERVICE: frontend
  FRONTEND_DIR: /home/david/nerux/virtus/frontend
  TEST_IMAGE: virtus-frontend-local-test

jobs:
  build-and-test:
    runs-on: [self-hosted, wsl]
    steps:
      - name: Build frontend test image
        run: docker build --target builder -t "$TEST_IMAGE" "$FRONTEND_DIR"

      - name: Run tests inside builder image
        run: docker run --rm -w /app -e NODE_OPTIONS="--localstorage-file=/tmp/vitest-localstorage.json" "$TEST_IMAGE" pnpm test

      - name: Build image & (re)create container
        run: docker compose up -d --build --no-deps "$SERVICE"

      - name: Wait for container to be running
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Running}}' "$SERVICE" 2>/dev/null || echo false)
            if [ "$status" = "true" ]; then echo "$SERVICE is running"; exit 0; fi
            sleep 2
          done
          echo "::error::$SERVICE did not start"; docker logs --tail 100 "$SERVICE" || true; exit 1
